<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Information Table</title>

</head>
<body>

<table>
  <tr>
    <th colspan="4" class="title">Student Information</th>
  </tr>

  <tr>
    <th rowspan="6" class="side">Info</th>
    <th rowspan="2" class="heading">Name</th>
    <th colspan="2" class="heading">Address</th>
  </tr>

  <tr>
    <th class="heading">City</th>
    <th class="heading">House</th>
  </tr>

  <tr>
    <td>A</td>
    <td>Delhi</td>
    <td>1</td>
  </tr>

  <tr>
    <td>B</td>
    <td>Mumbai</td>
    <td>2</td>
  </tr>

  <tr>
    <td>C</td>
    <td>Kolkata</td>
    <td>3</td>
  </tr>

  <tr>
    <td>D</td>
    <td>Pune</td>
    <td>4</td>
  </tr>
</table>

</body>
</html>
